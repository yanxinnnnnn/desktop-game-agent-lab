name: Founder notification manual test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverchan-manual-test
  cancel-in-progress: false

jobs:
  notifier-test:
    # 不执行 PR/任意分支；默认分支须已受保护，且仅仓库所有者可以实际发送。
    if: >-
      github.actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout approved default-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run offline tests with mocked HTTP and fake credentials
        run: python3 -m unittest discover -s tests/notifications -v
      - name: Send one fixed NOTIFIER_TEST (API acceptance only)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python3 -m tools.notifications --send
